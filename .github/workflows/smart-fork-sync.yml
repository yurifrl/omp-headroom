name: Smart Fork Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase fork onto upstream (fork commits win)
        run: |
          UPSTREAM_REPO="${{ vars.UPSTREAM_REPO }}"
          if [ -z "$UPSTREAM_REPO" ]; then
            UPSTREAM_REPO=$(gh api repos/${{ github.repository }} --jq '.parent.full_name // empty')
          fi
          if [ -z "$UPSTREAM_REPO" ]; then
            echo "::error::Not a fork and UPSTREAM_REPO not set"
            exit 1
          fi
          echo "UPSTREAM_REPO=$UPSTREAM_REPO" >> "$GITHUB_ENV"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream main

          BEHIND=$(git rev-list --count main..upstream/main)
          if [ "$BEHIND" -eq 0 ]; then
            echo "✅ Already up to date"
            exit 0
          fi
          echo "🔄 Fork is $BEHIND commit(s) behind upstream"
          git log --oneline main..upstream/main

          # Mechanical resolution only:
          #   rebase -X theirs  → overlapping hunks keep the FORK side
          #   (during rebase, "theirs" = the commits being replayed = fork commits)
          if git rebase -X theirs upstream/main; then
            echo "✅ Rebased cleanly onto upstream"
          else
            echo "⚠️ Strategy rebase still conflicted (tree-level), falling back to merge"
            git rebase --abort
            git merge -X ours upstream/main --no-edit
          fi

          git push origin main --force-with-lease
          echo "✅ Fork synced: $(git log --oneline -3)"
